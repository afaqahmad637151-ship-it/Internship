<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
 
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My Image Gallery</h1>
    <p>Explore Beutiful Moments</p>
    <div class="filter-buttons">
    <button class="filter-btn active" data-filter="All">All</button>
    <button class="filter-btn" data-filter="Nature">Nature</button>
    <button class="filter-btn" data-filter="Animals">Animals</button>
    <button class="filter-btn" data-filter="City">City</button>
    <button class="filter-btn" data-filter="Anime">Anime</button>
    <button class="filter-btn" data-filter="Others">Others</button>
</div>
    <div class="gallery">
   <img class="gallery-img" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" data-category="Nature" alt="Image 1" width="140" height="140">
   <img class="gallery-img" src="https://images.unsplash.com/photo-1516117172878-fd2c41f4a759" data-category="Animals" alt="Image 2" width="140" height="140">
    <img class="gallery-img" src="https://images.unsplash.com/photo-1532009324734-20a7a5813719" data-category="City" alt="Image 3" width="140" height="140">
  <img class="gallery-img" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" data-category="Nature" alt="Mountain Landscape" width="140" height="140">
  <img class="gallery-img" src="https://images.unsplash.com/photo-1448375240586-882707db888b" data-category="Nature" alt="Beautiful Forest" width="140" height="140">
 <img class="gallery-img" src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8" data-category="City" alt="Sunset" width="140" height="140">
 <img class="gallery-img" src="https://images.unsplash.com/photo-1490750967868-88aa4486c946" data-category="Others" alt="Flowers" width="140" height="140">
 <img class="gallery-img" src="https://images.unsplash.com/photo-1509316785289-025f5b846b35" data-category="Others" alt="Desert Landscape" width="140" height="140">
 <img class="gallery-img" src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564" data-category="Others" alt="Night Sky" width="140" height="140">
 <img class="gallery-img" src="https://images.unsplash.com/photo-1500534623283-312aade485b7" data-category="Others" alt="Green Hills" width="140" height="140">
 <img class="gallery-img" src="https://images.unsplash.com/photo-1433086966358-54859d0ed716" alt="Waterfall" width="140" height="140">
 
</div>
<div id="lightbox">

    <span id="close">&times;</span>

    <button id="prev">❮</button>

    <img id="lightbox-img">

    <button id="next">❯</button>

</div>
<script src="script.js"></script>

</body>
</html>
